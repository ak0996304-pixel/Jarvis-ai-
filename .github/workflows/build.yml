name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/jarvis/app app/src/main/res/xml
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Jarvis"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.jarvis.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.jarvis.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.READ_CALL_LOG"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
              </queries>
              <application
                  android:label="Jarvis"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".JarvisService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>
                  <service
                      android:name=".LockService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/lock_config"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/lock_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="Jarvis phone lock"
              android:notificationTimeout="100"/>
          EOF
          cat > app/src/main/java/com/jarvis/app/LockService.kt <<'EOF'
          package com.jarvis.app

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent

          class LockService : AccessibilityService() {
              companion object { var instance: LockService? = null }

              override fun onServiceConnected() { instance = this }
              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF
          cat > app/src/main/java/com/jarvis/app/MainActivity.kt <<'EOF'
          package com.jarvis.app

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val prefs = getSharedPreferences("jarvis", Context.MODE_PRIVATE)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 40)
                  }
                  fun btn(t: String, f: () -> Unit) {
                      root.addView(Button(this).apply { text = t; setOnClickListener { f() } })
                  }
                  root.addView(TextView(this).apply { text = "Jarvis"; textSize = 26f })
                  btn("1. अनुमतियाँ दें") {
                      requestPermissions(arrayOf(
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.CALL_PHONE,
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.READ_CALL_LOG,
                          "android.permission.POST_NOTIFICATIONS"
                      ), 1)
                  }
                  btn("2. Accessibility खोलें (Jarvis चालू करें)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  btn("3. Overlay अनुमति दें") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")))
                  }
                  btn("4. ऐप सेटिंग (Battery: No restriction)") {
                      startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                          Uri.parse("package:$packageName")))
                  }
                  root.addView(TextView(this).apply {
                      text = "अपने नाम (हर लाइन में नाम=ऐप), जैसे: टीवी=YouTube"
                  })
                  val et = EditText(this).apply {
                      setText(prefs.getString("aliases", "टीवी=YouTube"))
                      minLines = 4
                  }
                  root.addView(et)
                  btn("नाम सेव करें") {
                      prefs.edit().putString("aliases", et.text.toString()).apply()
                      Toast.makeText(this, "सेव हुआ", Toast.LENGTH_SHORT).show()
                  }
                  btn("▶ Jarvis शुरू करें") {
                      val i = Intent(this, JarvisService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                  }
                  btn("■ बंद करें") { stopService(Intent(this, JarvisService::class.java)) }
                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
          EOF
          cat > app/src/main/java/com/jarvis/app/JarvisService.kt <<'EOF'
          package com.jarvis.app

          import android.app.*
          import android.content.*
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.*
          import android.provider.ContactsContract
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telephony.TelephonyManager
          import java.util.Locale

          class JarvisService : Service(), TextToSpeech.OnInitListener {
              private var sr: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private val h = Handler(Looper.getMainLooper())
              private var awaiting = false
              private var pendingCall: String? = null
              private var busy = false
              private var inCall = false
              private var running = false
              private var lastRing = ""

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  running = true
                  return START_STICKY
              }

              override fun onCreate() {
                  super.onCreate()
                  running = true
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("jarvis", "Jarvis", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "jarvis")
                      .setContentTitle("Jarvis सुन रहा है")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  else startForeground(1, n)
                  tts = TextToSpeech(this, this)
                  val f = IntentFilter(TelephonyManager.ACTION_PHONE_STATE_CHANGED)
                  if (Build.VERSION.SDK_INT >= 33)
                      registerReceiver(callReceiver, f, Context.RECEIVER_EXPORTED)
                  else registerReceiver(callReceiver, f)
              }

              override fun onInit(status: Int) {
                  tts?.language = Locale("hi", "IN")
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) { busy = true }
                      override fun onDone(id: String?) { busy = false; h.post { listen() } }
                      override fun onError(id: String?) { busy = false; h.post { listen() } }
                  })
                  say("जार्विस तैयार है")
              }

              private fun say(t: String) {
                  busy = true
                  h.post { sr?.cancel() }
                  tts?.speak(t, TextToSpeech.QUEUE_FLUSH, null, "u")
              }

              private fun listen() {
                  if (!running || busy || inCall) return
                  try {
                      if (sr == null) {
                          sr = SpeechRecognizer.createSpeechRecognizer(this)
                          sr!!.setRecognitionListener(object : RecognitionListener {
                              override fun onResults(r: Bundle?) {
                                  val t = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                      ?.firstOrNull()
                                  if (t != null) handle(t)
                                  h.postDelayed({ listen() }, 300)
                              }
                              override fun onError(e: Int) {
                                  h.postDelayed({ listen() },
                                      if (e == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) 1500 else 500)
                              }
                              override fun onReadyForSpeech(p: Bundle?) {}
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(v: Float) {}
                              override fun onBufferReceived(b: ByteArray?) {}
                              override fun onEndOfSpeech() {}
                              override fun onPartialResults(p: Bundle?) {}
                              override fun onEvent(t: Int, p: Bundle?) {}
                          })
                      }
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                      }
                      sr!!.cancel()
                      sr!!.startListening(i)
                  } catch (e: Exception) {
                      h.postDelayed({ listen() }, 2000)
                  }
              }

              private val lockAction =
                  android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN

              private fun handle(raw: String) {
                  val low = raw.lowercase(Locale.ROOT).trim()
                  if (pendingCall != null) {
                      val num = pendingCall!!
                      pendingCall = null
                      val yes = listOf("हाँ", "हां", "haan", "yes", "लगाओ", "कर दो")
                      if (yes.any { low.contains(it) }) callNow(num) else say("ठीक है, रद्द")
                      return
                  }
                  var t = low
                  var woke = false
                  for (w in listOf("jarvis", "जार्विस", "जारविस", "hello", "हेलो", "हैलो")) {
                      if (t.contains(w)) { woke = true; t = t.replace(w, " ") }
                  }
                  t = t.trim()
                  if (!woke && !awaiting) return
                  awaiting = false
                  if (t.isEmpty()) { awaiting = true; say("हाँ बोलिए सर"); return }
                  when {
                      t.contains("लॉक") || t.contains("लोक") || t.contains("lock") -> {
                          val s = LockService.instance
                          if (s != null) s.performGlobalAction(lockAction)
                          else say("पहले Accessibility चालू करें")
                      }
                      t.contains("कॉल") || t.contains("call") ||
                          t.contains("फोन करो") || t.contains("फ़ोन करो") -> makeCall(t)
                      t.contains("खोल") || t.contains("open") ||
                          t.contains("ओपन") || t.contains("चालू") -> openApp(t)
                      else -> say("समझ नहीं आया")
                  }
              }

              private fun words(t: String, stop: Set<String>): String =
                  t.split(" ").filter { it.isNotBlank() && it !in stop }.joinToString(" ")

              private fun makeCall(t: String) {
                  val digits = t.mapNotNull { c -> Character.digit(c, 10).takeIf { it >= 0 } }
                      .joinToString("")
                  if (digits.length >= 5) {
                      pendingCall = digits
                      awaiting = false
                      say("${digits.toList().joinToString(" ")} पर कॉल लगाऊँ?")
                      return
                  }
                  val name = words(t, setOf("कॉल", "call", "करो", "कर", "दो", "लगाओ", "को",
                      "पर", "फोन", "फ़ोन", "नंबर", "number", "to"))
                  val c = findContact(name)
                  if (c == null) { say("$name नाम नहीं मिला"); return }
                  pendingCall = c.second
                  say("${c.first} को कॉल लगाऊँ?")
              }

              private fun findContact(name: String): Pair<String, String>? {
                  if (name.isBlank() ||
                      checkSelfPermission("android.permission.READ_CONTACTS")
                      != PackageManager.PERMISSION_GRANTED) return null
                  val c = contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER),
                      "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE ?",
                      arrayOf("%$name%"), null)
                  c?.use { if (it.moveToFirst()) return Pair(it.getString(0), it.getString(1)) }
                  return null
              }

              private fun callNow(num: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(num)))
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                      say("कॉल नहीं लग पाया, अनुमति देखें")
                  }
              }

              private fun openApp(t: String) {
                  val name = words(t, setOf("खोलो", "खोल", "open", "ओपन", "करो", "कर", "दो",
                      "चालू", "को", "ऐप", "app"))
                  val prefs = getSharedPreferences("jarvis", Context.MODE_PRIVATE)
                  val alias = prefs.getString("aliases", "")!!.lines().mapNotNull {
                      val p = it.split("=")
                      if (p.size == 2) p[0].trim().lowercase() to p[1].trim().lowercase() else null
                  }.toMap()
                  val hi = mapOf("यूट्यूब" to "youtube", "व्हाट्सएप" to "whatsapp",
                      "व्हाट्सऐप" to "whatsapp", "इंस्टाग्राम" to "instagram",
                      "टेलीग्राम" to "telegram", "जीमेल" to "gmail", "क्रोम" to "chrome",
                      "कैमरा" to "camera", "सेटिंग" to "settings", "सेटिंग्स" to "settings",
                      "फोनपे" to "phonepe", "गूगल" to "google")
                  var q = alias[name] ?: name
                  q = hi[q] ?: q
                  val pm = packageManager
                  val list = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                  val hit = list.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                  val li = hit?.let { pm.getLaunchIntentForPackage(it.activityInfo.packageName) }
                  if (li != null) {
                      startActivity(li.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      say("खोल रहा हूँ")
                  } else say("$name ऐप नहीं मिला")
              }

              private fun nameFor(num: String): String? {
                  try {
                      val u = Uri.withAppendedPath(
                          ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(num))
                      contentResolver.query(u, arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME),
                          null, null, null)?.use { if (it.moveToFirst()) return it.getString(0) }
                  } catch (e: Exception) {}
                  return null
              }

              private val callReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      when (i.getStringExtra(TelephonyManager.EXTRA_STATE)) {
                          TelephonyManager.EXTRA_STATE_RINGING -> {
                              inCall = true
                              h.post { sr?.cancel() }
                              val num = i.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER)
                                  ?: return
                              if (num == lastRing) return
                              lastRing = num
                              val nm = nameFor(num)
                              say(if (nm != null) "सर, $nm का फ़ोन आ रहा है"
                                  else "सर, अननोन नंबर से फ़ोन आ रहा है")
                          }
                          TelephonyManager.EXTRA_STATE_OFFHOOK -> inCall = true
                          TelephonyManager.EXTRA_STATE_IDLE -> {
                              inCall = false
                              lastRing = ""
                              h.postDelayed({ listen() }, 1000)
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { unregisterReceiver(callReceiver) } catch (e: Exception) {}
                  sr?.destroy()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/app-debug.apk
